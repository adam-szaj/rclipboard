# rclipboard configuration — UDS endpoint template
# Deployed by scripts/deploy.sh for hosts with endpoint_type=uds
# ${XDG_RUNTIME_DIR} is expanded by the server at runtime.
#
# To override for a specific host, create deploy/config/<hostname>.toml

[server]
    endpoint        = "uds://${XDG_RUNTIME_DIR}/rclipboard/uds.sock"
    log_level       = "warning"
    py_log_level    = "WARNING"
    notify_delay_ms = 500
    # admin_token = ""

[xsel]
    enabled     = false
    path        = "/usr/bin/xsel"
    interval_ms = 250
    encrypt     = false

[proxy]
    enabled = false
    # upstream_endpoint = ""

[ssl]
    certfile = ""
    keyfile  = ""

[client]
    transport = "uds"
