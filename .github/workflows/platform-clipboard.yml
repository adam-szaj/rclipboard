name: Platform clipboard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  platform-clipboard:
    name: ${{ matrix.os }} clipboard integration
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .
      - name: Run platform clipboard tests
        run: make test-platform-clipboard
